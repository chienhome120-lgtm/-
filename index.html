<title>特殊精華滾滾！皮克敏花盆大作戰</title>
<style>
:root{--bg:#0b1117;--gold:#ffd166;--danger:#ff5d73;--ok:#78e38b;--text:#edf4f7;--fun:#8ee3ff;--pink:#ff9fcb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 8%,#243846 0,#101820 45%,#080d12 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{width:min(100%,580px);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-weight:950;letter-spacing:.02em;font-size:clamp(18px,4.6vw,25px);text-shadow:0 2px 0 #000,0 0 14px #ffd16655}.subtitle{font-size:11px;color:#ffe7a8;font-weight:800;margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 9px;border-radius:999px;background:#131e27dd;border:1px solid #ffffff1c;font-weight:850;font-size:12px;white-space:nowrap;box-shadow:inset 0 0 0 1px #0004}.pill b{color:#ffd166}
.board-wrap{width:100%;display:flex;justify-content:center}.board{position:relative;width:min(96vw,560px);height:66dvh;max-height:720px;min-height:430px;border-radius:23px;overflow:hidden;touch-action:none;background:linear-gradient(135deg,#43544e,#26352f 58%,#1c2925);border:10px solid #5b3a24;box-shadow:0 22px 50px #0009,inset 0 0 0 4px #2d1b11,inset 0 0 45px #000b}.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 34px),radial-gradient(circle at 50% 50%,transparent 45%,#0008 100%);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%}.center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;pointer-events:none}.msg-card{max-width:88%;background:#091116e8;border:1px solid #ffffff28;border-radius:18px;padding:16px 18px;backdrop-filter:blur(8px);box-shadow:0 12px 30px #0009}.msg-card b{display:block;font-size:20px;margin-bottom:7px}.msg-card small{color:#c9d5db;line-height:1.55}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{border:0;border-radius:15px;padding:12px 10px;font-size:14px;font-weight:900;color:#111;background:linear-gradient(#ffe395,#ffc84e);box-shadow:0 6px 16px #0005,inset 0 1px #fff9;touch-action:manipulation}button.secondary{background:linear-gradient(#cfdae1,#9fb1bc)}
.hint{text-align:center;font-size:11.5px;line-height:1.42;color:#c9d7de;min-height:32px;background:#0b141bcc;border:1px dashed #ffffff24;border-radius:12px;padding:7px 10px}.funline{text-align:center;font-weight:900;font-size:12px;color:#ffe395;min-height:18px;text-shadow:0 1px 0 #000}.touch-pad{display:grid;grid-template-columns:repeat(3,51px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;opacity:.78;user-select:none}.touch-pad button{padding:0;border-radius:12px;background:#26333c;color:#fff;box-shadow:none;border:1px solid #ffffff18;font-size:19px}.touch-pad .up{grid-column:2}.touch-pad .left{grid-column:1}.touch-pad .down{grid-column:2}.touch-pad .right{grid-column:3}
.toast{position:fixed;left:50%;top:11%;transform:translate(-50%,-10px);padding:9px 15px;border-radius:999px;font-weight:900;background:#071019e9;border:1px solid #ffffff33;opacity:0;pointer-events:none;transition:.18s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-height:700px){.board{height:62dvh;min-height:360px}.app{gap:5px}.hint{padding:5px 8px;min-height:26px}.touch-pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,36px)}}

.rotate-guard{display:none;position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 35%,#263c49 0,#101820 48%,#080d12 100%);color:#fff;align-items:center;justify-content:center;text-align:center;padding:28px}.rotate-guard .card{max-width:360px;background:#0a131beF;border:1px solid #ffffff30;border-radius:24px;padding:24px 20px;box-shadow:0 20px 60px #000b}.rotate-guard .icon{font-size:56px;display:block;margin-bottom:10px}.rotate-guard b{font-size:22px;display:block;color:#ffe395;margin-bottom:8px}.rotate-guard small{font-size:13px;line-height:1.6;color:#d8e2e7}

<div class="app">
  <div class="top"><div><div class="title">🌱 花盆出任務！</div><div class="subtitle">皮克敏尋寶大作戰・手機歪一點，花盆滾遠一點</div></div><div class="stats"><div class="pill">🗺️ <b>第<span id="level">1</span>關</b></div><div class="pill">💰 <span id="score">0</span>分</div><div class="pill">🔥 <span id="combo">x1</span></div><div class="pill">⏰ <span id="time">60</span>s</div><div class="pill">📡 <span id="sensorState">未啟用</span></div></div></div>

(()=>{
const canvas=document.getElementById('game'),board=document.getElementById('board'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),levelEl=document.getElementById('level'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay'),sensorBtn=document.getElementById('sensorBtn'),soundBtn=document.getElementById('soundBtn'),restartBtn=document.getElementById('restartBtn'),hint=document.getElementById('hint'),toast=document.getElementById('toast'),sensorState=document.getElementById('sensorState'),funline=document.getElementById('funline');
let W=0,H=0,dpr=1,last=performance.now(),running=false,score=0,timeLeft=60,lastSecond=performance.now(),level=1,combo=1,lastChestAt=0,chestsTaken=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const FUN={
  chest:['花盆到手！園藝部門表示欣慰。','✨ 特殊精華：今天的運氣正在發光。','不是撿寶，是採集高濃度快樂。','連吃精華中，請勿打擾吸收能量。','花盆表示：這波營養很補。'],
  bomb:['皮克敏：我這麼可愛你也撞？','撞到皮克敏，分數先去角落反省。','特殊精華表示：剛才那不是煞車，是社交。','小心！這些皮克敏今天脾氣不太好。'],
  hole:['地下室一日遊，已自動辦理退房。','黑洞說：歡迎再次光臨。','這不是失誤，是深入探索地形。','特殊精華短暫離線，人生重新連線。']
};
function randomFun(kind){const a=FUN[kind]||['鋼珠持續努力中。'];return a[Math.floor(Math.random()*a.length)]}
function setFunLine(t){funline.textContent=t}

let audioCtx=null,masterGain=null,compressor=null;
function initAudio(){
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      audioCtx=new AC();
    }
    if(!masterGain){
      masterGain=audioCtx.createGain(); masterGain.gain.value=.9;
      compressor=audioCtx.createDynamicsCompressor();
      compressor.threshold.value=-20; compressor.knee.value=18; compressor.ratio.value=3.5;
      compressor.attack.value=.002; compressor.release.value=.16;
      masterGain.connect(compressor).connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return true;
  }catch(e){return false}
}
function unlockAudio(audible=false){
  if(!initAudio()||!audioCtx)return Promise.resolve(false);
  const doPing=()=>{
    try{
      const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(audible?660:440,t);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(audible?.11:.0002,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+(audible?.11:.025));
      o.connect(g).connect(masterGain); o.start(t); o.stop(t+(audible?.13:.03));
      return true;
    }catch(e){return false}
  };
  if(audioCtx.state==='suspended') return audioCtx.resume().then(()=>doPing()).catch(()=>false);
  return Promise.resolve(doPing());
}
function rand(a,b){return a+Math.random()*(b-a)}
function env(g,t,peak,attack,hold,release){
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+attack);
  g.gain.setValueAtTime(Math.max(.0002,peak),t+attack+hold);
  g.gain.exponentialRampToValueAtTime(.0001,t+attack+hold+release);
}
function osc(freq,dur,type='sine',vol=.08,slideTo=null,when=0,dest=null){
  initAudio(); if(!audioCtx||!masterGain)return;
  const t=audioCtx.currentTime+when,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(25,slideTo),t+dur);
  env(g,t,vol,.004,Math.max(0,dur*.08),Math.max(.02,dur*.86));
  o.connect(g).connect(dest||masterGain); o.start(t); o.stop(t+dur+.04);
}
function noiseBurst(dur=.12,vol=.08,low=80,high=9000,when=0){
  initAudio(); if(!audioCtx||!masterGain)return;
  const t=audioCtx.currentTime+when,len=Math.max(1,Math.floor(audioCtx.sampleRate*dur));
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource(),hp=audioCtx.createBiquadFilter(),lp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
  hp.type='highpass'; hp.frequency.value=low; lp.type='lowpass'; lp.frequency.value=high;
  env(g,t,vol,.002,0,Math.max(.02,dur*.96)); src.buffer=buf;
  src.connect(hp).connect(lp).connect(g).connect(masterGain); src.start(t); src.stop(t+dur+.03);
}
function metallicHit(strength=.7,when=0){
  const base=rand(150,205),v=.045*strength;
  noiseBurst(.045,.07*strength,650,6500,when);
  osc(base,.12,'triangle',v,base*.62,when);
  osc(base*2.73,.055,'sine',v*.42,base*2.2,when+.004);
  osc(base*4.18,.035,'sine',v*.25,base*3.4,when+.006);
}
function coinClink(when=0,pitch=1){
  noiseBurst(.026,.035,1800,11000,when);
  osc(1850*pitch,.13,'sine',.055,1380*pitch,when);
  osc(2780*pitch,.08,'sine',.03,2250*pitch,when+.008);
}

const htmlAudioPools={};
let htmlAudioUnlocked=false;
function getHtmlAudio(kind){
  const src=SOUND_DATA[kind]||SOUND_DATA.test;
  if(!htmlAudioPools[kind]){
    htmlAudioPools[kind]=Array.from({length:4},()=>{
      const a=new Audio(src); a.preload='auto'; a.volume=.95; return a;
    });
  }
  let a=htmlAudioPools[kind].find(x=>x.paused||x.ended) || htmlAudioPools[kind][0];
  try{a.pause();a.currentTime=0;}catch(e){}
  return a;
}
function playHtmlSound(kind){
  try{
    const a=getHtmlAudio(kind);
    const pr=a.play();
    if(pr&&pr.then){
      pr.then(()=>{htmlAudioUnlocked=true; soundBtn.textContent='🔊 音效已開';})
        .catch(()=>{soundBtn.textContent='🔇 點我開音效';});
    }else htmlAudioUnlocked=true;
    return true;
  }catch(e){soundBtn.textContent='🔇 音效失敗';return false;}
}
function unlockHtmlAudio(){
  const a=getHtmlAudio('test');
  try{
    a.volume=.9; a.currentTime=0;
    const pr=a.play();
    if(pr&&pr.then) return pr.then(()=>{htmlAudioUnlocked=true; soundBtn.textContent='🔊 音效已開'; return true;}).catch(()=>false);
    htmlAudioUnlocked=true; soundBtn.textContent='🔊 音效已開'; return Promise.resolve(true);
  }catch(e){return Promise.resolve(false);}
}
function playSound(kind){ return playHtmlSound(kind); }

function resize(){const r=board.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width-20;H=r.height-20;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!ball.x){ball.x=W/2;ball.y=H/2}}
new ResizeObserver(resize).observe(board);resize();
function toastMsg(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),760)}

  ctx.fillStyle='#1d1b20';for(const ex of [-3.2,3.2]){ctx.beginPath();ctx.arc(ex,-8.8,1.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-.4,-9.4,.35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1d1b20'}
  if(p.shape==='mouth'){ctx.strokeStyle='#183f84';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-4.5,3.3,.05*Math.PI,.95*Math.PI);ctx.stroke();}
  // 莖、葉、花
  ctx.strokeStyle=p.stem;ctx.lineWidth=1.9;ctx.beginPath();ctx.moveTo(0,-17);ctx.quadraticCurveTo(2,-23,-1,-29);ctx.stroke();
  const flower=((o.typeIndex+t*.15)%3)>1.9;
  if(flower){for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(Math.cos(a)*3.5,-29+Math.sin(a)*3.5,2.4,3,a,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(0,-29,2.1,0,Math.PI*2);ctx.fill();}
  else {ctx.fillStyle='#62b555';ctx.beginPath();ctx.ellipse(3,-29,6.4,3.1,-.48,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3d8138';ctx.lineWidth=.7;ctx.stroke();}
  ctx.restore();
}
function draw(t){ctx.clearRect(0,0,W,H);let grad=ctx.createRadialGradient(W*(.5-tilt.x*.12),H*(.5-tilt.y*.12),10,W/2,H/2,W*.7);grad.addColorStop(0,'#ffffff12');grad.addColorStop(1,'#0000002b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ramps.forEach(r=>{let g=ctx.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);g.addColorStop(0,'#7a5caf55');g.addColorStop(1,'#3e2d7055');ctx.fillStyle=g;ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#b9a0ff88';ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);ctx.fillStyle='#e1d6ff99';ctx.font='bold 18px sans-serif';ctx.fillText(r.fx>0?'➜':'➜',r.x+r.w/2-8,r.y+r.h/2+6)});
  holes.forEach(h=>{let g=ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,h.r);g.addColorStop(0,'#000');g.addColorStop(.65,'#050607');g.addColorStop(1,'#69726c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0009';ctx.stroke()});
  magnets.forEach(m=>{ctx.save();ctx.translate(m.x,m.y);ctx.shadowColor='#69b8ff';ctx.shadowBlur=15;ctx.strokeStyle='#63b5ff';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,17,.18*Math.PI,.82*Math.PI,true);ctx.stroke();ctx.strokeStyle='#ff6474';ctx.beginPath();ctx.moveTo(-15,-10);ctx.lineTo(-15,8);ctx.moveTo(15,-10);ctx.lineTo(15,8);ctx.stroke();ctx.restore()});
  walls.forEach(r=>{let g=ctx.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);g.addColorStop(0,'#6a4935');g.addColorStop(.5,'#3d281c');g.addColorStop(1,'#1c120d');ctx.fillStyle=g;ctx.shadowColor='#0008';ctx.shadowBlur=5;ctx.fillRect(r.x,r.y,r.w,r.h);ctx.shadowBlur=0;ctx.strokeStyle='#a07b5d55';ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1)});
  chests.forEach(o=>drawChest(o,t));bombs.forEach(o=>drawBomb(o,t));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.kind==='gold'?'#d98a5c':p.kind==='bomb'?'#ffb8d8':'#7b8790';ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1});drawMetalBall()}
function loop(now){let dt=Math.min((now-last)/1000,.032);last=now;if(running&&now-lastSecond>=1000){let n=Math.floor((now-lastSecond)/1000);timeLeft-=n;lastSecond+=n*1000;timeEl.textContent=Math.max(0,timeLeft);if(timeLeft<=0){running=false;overlay.style.display='flex';overlay.querySelector('.msg-card').innerHTML=`<b>⏰ 時間到！${score} 分</b><small>你撐到第 ${level} 關。<br>${score>=1200?'花盆：老闆，我今天表現可以換大一點的盆嗎？':score>=500?'花盆：至少我們不是空盆回家。':'花盆：這局先當作園藝設備測試。'}<br>按「我不服，再來一次」繼續。</small>`}}physics(dt,now);draw(now/1000);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
