<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>鋼珠平衡尋寶・進階版</title>
<style>
:root{--bg:#0b1117;--gold:#ffd166;--danger:#ff5d73;--ok:#78e38b;--text:#edf4f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 8%,#243846 0,#101820 45%,#080d12 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{width:min(100%,580px);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-weight:950;letter-spacing:.04em;font-size:clamp(18px,4.6vw,25px)}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 9px;border-radius:999px;background:#131e27dd;border:1px solid #ffffff1c;font-weight:850;font-size:12px;white-space:nowrap}
.board-wrap{width:100%;display:flex;justify-content:center}.board{position:relative;width:min(94vw,530px);aspect-ratio:1/1;border-radius:23px;overflow:hidden;touch-action:none;background:linear-gradient(135deg,#43544e,#26352f 58%,#1c2925);border:10px solid #5b3a24;box-shadow:0 22px 50px #0009,inset 0 0 0 4px #2d1b11,inset 0 0 45px #000b}.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 34px),radial-gradient(circle at 50% 50%,transparent 45%,#0008 100%);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%}.center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;pointer-events:none}.msg-card{max-width:88%;background:#091116e8;border:1px solid #ffffff28;border-radius:18px;padding:16px 18px;backdrop-filter:blur(8px);box-shadow:0 12px 30px #0009}.msg-card b{display:block;font-size:20px;margin-bottom:7px}.msg-card small{color:#c9d5db;line-height:1.55}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:15px;padding:12px 10px;font-size:14px;font-weight:900;color:#111;background:linear-gradient(#ffe395,#ffc84e);box-shadow:0 6px 16px #0005,inset 0 1px #fff9;touch-action:manipulation}button.secondary{background:linear-gradient(#cfdae1,#9fb1bc)}
.hint{text-align:center;font-size:11.5px;line-height:1.42;color:#b8c7cf;min-height:32px}.touch-pad{display:grid;grid-template-columns:repeat(3,51px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;opacity:.78;user-select:none}.touch-pad button{padding:0;border-radius:12px;background:#26333c;color:#fff;box-shadow:none;border:1px solid #ffffff18;font-size:19px}.touch-pad .up{grid-column:2}.touch-pad .left{grid-column:1}.touch-pad .down{grid-column:2}.touch-pad .right{grid-column:3}
.toast{position:fixed;left:50%;top:11%;transform:translate(-50%,-10px);padding:9px 15px;border-radius:999px;font-weight:900;background:#071019e9;border:1px solid #ffffff33;opacity:0;pointer-events:none;transition:.18s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title">⚙️ 鋼珠平衡尋寶</div><div class="stats"><div class="pill">關卡 <span id="level">1</span></div><div class="pill">分數 <span id="score">0</span></div><div class="pill">Combo <span id="combo">x1</span></div><div class="pill">時間 <span id="time">60</span>s</div><div class="pill">感測 <span id="sensorState">未啟用</span></div></div></div>
  <div class="board-wrap"><div class="board" id="board"><canvas id="game"></canvas><div class="center-msg" id="overlay"><div class="msg-card"><b>傾斜手機，讓鋼珠滾動</b><small>寶箱 +100，連吃可增加 Combo。<br>炸彈 -150，黑洞會把鋼珠吞回起點。<br>磁鐵會吸引鋼珠，紫色斜坡會推動鋼珠。</small></div></div></div></div>
  <div class="controls"><button id="sensorBtn">📱 啟用傾斜</button><button class="secondary" id="restartBtn">↻ 重新開始</button></div>
  <div class="hint" id="hint">先將手機保持你覺得舒服的角度，再按「啟用傾斜」完成校正。建議使用 HTTPS 網址。</div>
  <div class="touch-pad" id="touchPad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('game'),board=document.getElementById('board'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),levelEl=document.getElementById('level'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay'),sensorBtn=document.getElementById('sensorBtn'),restartBtn=document.getElementById('restartBtn'),hint=document.getElementById('hint'),toast=document.getElementById('toast'),sensorState=document.getElementById('sensorState');
let W=0,H=0,dpr=1,last=performance.now(),running=false,score=0,timeLeft=60,lastSecond=performance.now(),level=1,combo=1,lastChestAt=0,chestsTaken=0;
let tilt={x:0,y:0},base={beta:0,gamma:0},sensorActive=false,sensorSeen=false,keyTilt={x:0,y:0},screenAngle=0,lastWallSound=0,lastBoundarySound=0,lastRampSound=0,lastMagnetSound=0;
let ball={x:0,y:0,vx:0,vy:0,r:14},chests=[],bombs=[],walls=[],holes=[],magnets=[],ramps=[],particles=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let audioCtx=null;
function initAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq=440,dur=.08,type='sine',vol=.08,slide=0){initAudio();if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur=.12,vol=.08){initAudio();if(!audioCtx)return;const len=Math.floor(audioCtx.sampleRate*dur),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const src=audioCtx.createBufferSource(),g=audioCtx.createGain();src.buffer=buf;g.gain.value=vol;src.connect(g).connect(audioCtx.destination);src.start()}
function playSound(kind){
  if(kind==='chest'){tone(660,.07,'triangle',.09,220);setTimeout(()=>tone(990,.11,'triangle',.07,250),55)}
  else if(kind==='bomb'){noise(.18,.14);tone(120,.22,'sawtooth',.12,-70)}
  else if(kind==='hole'){tone(260,.28,'sine',.11,-190)}
  else if(kind==='wall'){tone(180,.045,'square',.035,40)}
  else if(kind==='ramp'){tone(390,.08,'triangle',.04,100)}
  else if(kind==='magnet'){tone(520,.07,'sine',.035,-80)}
  else if(kind==='level'){tone(523,.08,'triangle',.07,120);setTimeout(()=>tone(659,.08,'triangle',.07,150),90);setTimeout(()=>tone(784,.12,'triangle',.08,180),180)}
}
function resize(){const r=board.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width-20;H=r.height-20;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!ball.x){ball.x=W/2;ball.y=H/2}}
new ResizeObserver(resize).observe(board);resize();
function toastMsg(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),760)}
function randomSpot(radius=24,extra=0){for(let t=0;t<400;t++){let p={x:35+Math.random()*(W-70),y:35+Math.random()*(H-70)};if(Math.hypot(p.x-ball.x,p.y-ball.y)<85)continue;let all=[...chests,...bombs,...holes,...magnets];if(all.some(o=>Math.hypot(p.x-o.x,p.y-o.y)<radius+(o.r||24)+18+extra))continue;if(walls.some(r=>p.x>r.x-35&&p.x<r.x+r.w+35&&p.y>r.y-35&&p.y<r.y+r.h+35))continue;return p}return{x:55,y:55}}
function baseWalls(){return[{x:W*.13,y:H*.27,w:W*.26,h:12},{x:W*.58,y:H*.15,w:12,h:H*.25},{x:W*.56,y:H*.63,w:W*.27,h:12},{x:W*.24,y:H*.73,w:12,h:H*.17}]}
function setupLevel(n,resetScore=false){level=n;if(resetScore){score=0}scoreEl.textContent=score;levelEl.textContent=level;combo=1;comboEl.textContent='x1';lastChestAt=0;chestsTaken=0;timeLeft=60;timeEl.textContent=timeLeft;ball={x:W/2,y:H/2,vx:0,vy:0,r:14};chests=[];bombs=[];walls=baseWalls();holes=[];magnets=[];ramps=[];particles=[];
  const chestCount=Math.min(4+n,7),bombCount=Math.min(2+n,6),holeCount=n>=2?Math.min(n-1,3):0,magnetCount=n>=2?1:0,rampCount=n>=3?Math.min(n-2,2):0;
  for(let i=0;i<chestCount;i++){let p=randomSpot();chests.push({...p,r:19,alive:true,pulse:Math.random()*6})}
  for(let i=0;i<bombCount;i++){let p=randomSpot();bombs.push({...p,r:18,alive:true,pulse:Math.random()*6,vx:n>=3?(Math.random()>.5?1:-1)*(18+n*7):0,vy:n>=3?(Math.random()>.5?1:-1)*(15+n*6):0})}
  for(let i=0;i<holeCount;i++){let p=randomSpot(22,10);holes.push({...p,r:20})}
  for(let i=0;i<magnetCount;i++){let p=randomSpot(25,10);magnets.push({...p,r:24,strength:120+n*20})}
  for(let i=0;i<rampCount;i++){ramps.push({x:W*(.14+i*.48),y:H*(.48-i*.18),w:W*.22,h:H*.12,fx:i%2?140:-140,fy:i%2?-40:60})}
  last=performance.now();lastSecond=performance.now();running=true;overlay.style.display='none';toastMsg('第 '+level+' 關開始！');
}
function restart(){setupLevel(1,true)}
function getScreenAngle(){const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);return ((a%360)+360)%360}
function applyOrientation(beta,gamma){
  if(beta==null||gamma==null)return;
  sensorSeen=true;screenAngle=getScreenAngle();
  if(!sensorActive){base.beta=beta;base.gamma=gamma;sensorActive=true;sensorState.textContent='已啟用';sensorState.style.color='#78e38b';}
  let gx=gamma-base.gamma, gy=beta-base.beta;
  // 依螢幕旋轉方向修正 X/Y 軸，橫拿手機也能正常控制
  let x=gx,y=gy;
  if(screenAngle===90){x=gy;y=-gx}else if(screenAngle===270){x=-gy;y=gx}else if(screenAngle===180){x=-gx;y=-gy}
  tilt.x=clamp(x/18,-1.35,1.35);
  tilt.y=clamp(y/18,-1.35,1.35);
}
function onOrientation(e){applyOrientation(e.beta,e.gamma)}
async function enableSensor(){
  initAudio();
  try{
    if(typeof DeviceOrientationEvent==='undefined')throw new Error('not supported');
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted')throw new Error('permission denied');
    }
    sensorActive=false;sensorSeen=false;tilt.x=tilt.y=0;
    window.removeEventListener('deviceorientation',onOrientation,true);
    window.removeEventListener('deviceorientationabsolute',onOrientation,true);
    window.addEventListener('deviceorientation',onOrientation,true);
    window.addEventListener('deviceorientationabsolute',onOrientation,true);
    sensorBtn.textContent='✓ 傾斜已啟用';sensorState.textContent='等待資料';sensorState.style.color='#ffd166';
    hint.textContent='傾斜感測已開啟。請把手機保持目前角度約 1 秒，接著左右、前後傾斜測試。';
    restart();
    setTimeout(()=>{
      if(!sensorSeen){sensorState.textContent='無資料';sensorState.style.color='#ff7b8c';hint.textContent='手機沒有回傳傾斜資料。請用 HTTPS（例如 GitHub Pages）開啟，並確認瀏覽器已允許「動作與方向」權限；下方方向鍵仍可操作。'}
      else{hint.textContent='感測器運作中。左右／前後傾斜手機即可滾動鋼珠；如方向不自然，可重新按一次「啟用傾斜」校正。'}
    },1600);
  }catch(e){
    sensorState.textContent='不可用';sensorState.style.color='#ff7b8c';
    hint.textContent='無法取得手機方向感測器。請改用 HTTPS 網址及 Safari/Chrome 開啟；目前可用下方方向鍵遊玩。';restart();
  }
}
sensorBtn.addEventListener('click',enableSensor);restartBtn.addEventListener('click',()=>{initAudio();restart()});document.addEventListener('pointerdown',initAudio,{once:true});
document.querySelectorAll('#touchPad button').forEach(b=>{const d=b.dataset.dir,down=e=>{e.preventDefault();initAudio();if(!running)restart();if(d==='left')keyTilt.x=-1;if(d==='right')keyTilt.x=1;if(d==='up')keyTilt.y=-1;if(d==='down')keyTilt.y=1},up=e=>{e.preventDefault();if(d==='left'||d==='right')keyTilt.x=0;if(d==='up'||d==='down')keyTilt.y=0};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
function circleRectCollide(c,r){let nx=clamp(c.x,r.x,r.x+r.w),ny=clamp(c.y,r.y,r.y+r.h),dx=c.x-nx,dy=c.y-ny;return dx*dx+dy*dy<c.r*c.r?{dx,dy}:null}
function burst(x,y,kind){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.6,size:2+Math.random()*4,kind})}
function resetBall(penalty=0){score+=penalty;scoreEl.textContent=score;combo=1;comboEl.textContent='x1';ball.x=W/2;ball.y=H/2;ball.vx=0;ball.vy=0}
function physics(dt,now){if(!running)return;let ax=(Math.abs(keyTilt.x)>.01?keyTilt.x:tilt.x)*460,ay=(Math.abs(keyTilt.y)>.01?keyTilt.y:tilt.y)*460;
  magnets.forEach(m=>{let dx=m.x-ball.x,dy=m.y-ball.y,d=Math.max(35,Math.hypot(dx,dy));if(d<150){let f=m.strength*(1-d/150);ax+=dx/d*f;ay+=dy/d*f;if(d<ball.r+m.r+8&&performance.now()-lastMagnetSound>350){playSound('magnet');lastMagnetSound=performance.now()}}});
  ramps.forEach(r=>{if(ball.x>r.x&&ball.x<r.x+r.w&&ball.y>r.y&&ball.y<r.y+r.h){ax+=r.fx;ay+=r.fy;if(performance.now()-lastRampSound>650){playSound('ramp');lastRampSound=performance.now()}}});
  ball.vx+=ax*dt;ball.vy+=ay*dt;const drag=Math.pow(.985,dt*60);ball.vx*=drag;ball.vy*=drag;let sp=Math.hypot(ball.vx,ball.vy),max=520+level*20;if(sp>max){ball.vx*=max/sp;ball.vy*=max/sp}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  const bounce=.61;let boundaryHit=false;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*bounce;boundaryHit=true}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*bounce;boundaryHit=true}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*bounce;boundaryHit=true}if(ball.y>H-ball.r){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)*bounce;boundaryHit=true}if(boundaryHit&&performance.now()-lastBoundarySound>120){playSound('wall');lastBoundarySound=performance.now()}
  walls.forEach(r=>{if(!circleRectCollide(ball,r))return;let cx=r.x+r.w/2,cy=r.y+r.h/2,dx=ball.x-cx,dy=ball.y-cy;if(Math.abs(dx/(r.w||1))>Math.abs(dy/(r.h||1))){ball.x=dx<0?r.x-ball.r:r.x+r.w+ball.r;ball.vx*=-.64}else{ball.y=dy<0?r.y-ball.r:r.y+r.h+ball.r;ball.vy*=-.64}if(performance.now()-lastWallSound>110){playSound('wall');lastWallSound=performance.now()}});
  bombs.forEach(o=>{if(!o.alive)return;if(level>=3){o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<o.r||o.x>W-o.r)o.vx*=-1;if(o.y<o.r||o.y>H-o.r)o.vy*=-1;o.x=clamp(o.x,o.r,W-o.r);o.y=clamp(o.y,o.r,H-o.r)}if(Math.hypot(ball.x-o.x,ball.y-o.y)<ball.r+o.r){o.alive=false;score-=150;scoreEl.textContent=score;combo=1;comboEl.textContent='x1';toastMsg('💥 炸彈 -150');playSound('bomb');burst(o.x,o.y,'bomb');ball.vx*=-.8;ball.vy*=-.8;if(navigator.vibrate)navigator.vibrate([35,35,70]);setTimeout(()=>{let p=randomSpot();Object.assign(o,p,{alive:true})},1000)}});
  holes.forEach(h=>{if(Math.hypot(ball.x-h.x,ball.y-h.y)<ball.r+h.r-5){toastMsg('🕳️ 掉進洞穴 -100');playSound('hole');burst(ball.x,ball.y,'hole');if(navigator.vibrate)navigator.vibrate(80);resetBall(-100)}});
  chests.forEach(o=>{if(o.alive&&Math.hypot(ball.x-o.x,ball.y-o.y)<ball.r+o.r){o.alive=false;const quick=now-lastChestAt<3500;combo=quick?Math.min(combo+1,5):1;lastChestAt=now;comboEl.textContent='x'+combo;const gain=100*combo;score+=gain;scoreEl.textContent=score;chestsTaken++;toastMsg('✨ 寶箱 +'+gain+(combo>1?'  Combo x'+combo:''));playSound('chest');burst(o.x,o.y,'gold');if(navigator.vibrate)navigator.vibrate(20);setTimeout(()=>{let p=randomSpot();Object.assign(o,p,{alive:true})},800);if(chestsTaken>=8+level*2){running=false;setTimeout(()=>setupLevel(level+1,false),700);playSound('level');toastMsg('🎉 過關！進入第 '+(level+1)+' 關')}}});
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt});particles=particles.filter(p=>p.life>0)
}
function drawMetalBall(){ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=14;ctx.shadowOffsetY=8;let g=ctx.createRadialGradient(ball.x-ball.r*.42,ball.y-ball.r*.5,2,ball.x,ball.y,ball.r*1.2);g.addColorStop(0,'#fff');g.addColorStop(.16,'#dce5e8');g.addColorStop(.48,'#717f85');g.addColorStop(.77,'#263034');g.addColorStop(1,'#090c0e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#ffffff88';ctx.stroke();ctx.restore()}
function drawChest(o,t){if(!o.alive)return;ctx.save();ctx.translate(o.x,o.y);let s=1+Math.sin(t*4+o.pulse)*.035;ctx.scale(s,s);ctx.shadowColor='#ffcc44';ctx.shadowBlur=12;ctx.fillStyle='#8d5524';ctx.strokeStyle='#3e230e';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-18,-10,36,25,5);ctx.fill();ctx.stroke();ctx.fillStyle='#b06b2e';ctx.beginPath();ctx.roundRect(-18,-18,36,13,[7,7,2,2]);ctx.fill();ctx.stroke();ctx.fillStyle='#ffd166';ctx.fillRect(-3,-15,6,28);ctx.fillRect(-18,-4,36,5);ctx.restore()}
function drawBomb(o,t){if(!o.alive)return;ctx.save();ctx.translate(o.x,o.y);ctx.shadowColor='#ff4b4b';ctx.shadowBlur=8;let g=ctx.createRadialGradient(-6,-8,2,0,0,20);g.addColorStop(0,'#666');g.addColorStop(.35,'#202529');g.addColorStop(1,'#050708');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,3,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(8,-10);ctx.quadraticCurveTo(16,-23,21,-15);ctx.stroke();ctx.fillStyle=Math.sin(t*18)>0?'#fff1a8':'#ff6b35';ctx.beginPath();ctx.arc(22,-16,4.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);let grad=ctx.createRadialGradient(W*(.5-tilt.x*.12),H*(.5-tilt.y*.12),10,W/2,H/2,W*.7);grad.addColorStop(0,'#ffffff12');grad.addColorStop(1,'#0000002b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ramps.forEach(r=>{let g=ctx.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);g.addColorStop(0,'#7a5caf55');g.addColorStop(1,'#3e2d7055');ctx.fillStyle=g;ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#b9a0ff88';ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);ctx.fillStyle='#e1d6ff99';ctx.font='bold 18px sans-serif';ctx.fillText(r.fx>0?'➜':'➜',r.x+r.w/2-8,r.y+r.h/2+6)});
  holes.forEach(h=>{let g=ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,h.r);g.addColorStop(0,'#000');g.addColorStop(.65,'#050607');g.addColorStop(1,'#69726c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0009';ctx.stroke()});
  magnets.forEach(m=>{ctx.save();ctx.translate(m.x,m.y);ctx.shadowColor='#69b8ff';ctx.shadowBlur=15;ctx.strokeStyle='#63b5ff';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,17,.18*Math.PI,.82*Math.PI,true);ctx.stroke();ctx.strokeStyle='#ff6474';ctx.beginPath();ctx.moveTo(-15,-10);ctx.lineTo(-15,8);ctx.moveTo(15,-10);ctx.lineTo(15,8);ctx.stroke();ctx.restore()});
  walls.forEach(r=>{let g=ctx.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);g.addColorStop(0,'#6a4935');g.addColorStop(.5,'#3d281c');g.addColorStop(1,'#1c120d');ctx.fillStyle=g;ctx.shadowColor='#0008';ctx.shadowBlur=5;ctx.fillRect(r.x,r.y,r.w,r.h);ctx.shadowBlur=0;ctx.strokeStyle='#a07b5d55';ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1)});
  chests.forEach(o=>drawChest(o,t));bombs.forEach(o=>drawBomb(o,t));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.kind==='gold'?'#ffd166':p.kind==='bomb'?'#ff6b5f':'#7b8790';ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1});drawMetalBall()}
function loop(now){let dt=Math.min((now-last)/1000,.032);last=now;if(running&&now-lastSecond>=1000){let n=Math.floor((now-lastSecond)/1000);timeLeft-=n;lastSecond+=n*1000;timeEl.textContent=Math.max(0,timeLeft);if(timeLeft<=0){running=false;overlay.style.display='flex';overlay.querySelector('.msg-card').innerHTML=`<b>時間到！最終 ${score} 分</b><small>你到達第 ${level} 關。<br>按「重新開始」再挑戰一次。</small>`}}physics(dt,now);draw(now/1000);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
