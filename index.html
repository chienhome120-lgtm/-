<!DOCTYPE html>

<title>花盆別鬧了！皮克敏尋寶大作戰</title>
<style>
:root{--bg:#0b1117;--gold:#ffd166;--danger:#ff5d73;--ok:#78e38b;--text:#edf4f7;--fun:#8ee3ff;--pink:#ff9fcb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 8%,#243846 0,#101820 45%,#080d12 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{width:min(100%,580px);padding-top:8px;display:flex;flex-direction:column;gap:8px}

.title{font-weight:950;letter-spacing:.02em;font-size:clamp(18px,4.6vw,25px);text-shadow:0 2px 0 #000,0 0 14px #ffd16655}.subtitle{font-size:11px;color:#ffe7a8;font-weight:800;margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 9px;border-radius:999px;background:#131e27dd;border:1px solid #ffffff1c;font-weight:850;font-size:12px;white-space:nowrap;box-shadow:inset 0 0 0 1px #0004}.pill b{color:#ffd166}
.board-wrap{width:100%;display:flex;justify-content:center}.board{position:relative;width:min(96vw,560px);height:66dvh;max-height:720px;min-height:430px;border-radius:23px;overflow:hidden;touch-action:none;background:linear-gradient(135deg,#43544e,#26352f 58%,#1c2925);border:10px solid #5b3a24;box-shadow:0 22px 50px #0009,inset 0 0 0 4px #2d1b11,inset 0 0 45px #000b}.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 34px),radial-gradient(circle at 50% 50%,transparent 45%,#0008 100%);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%}.center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;pointer-events:none}.msg-card{max-width:88%;background:#091116e8;border:1px solid #ffffff28;border-radius:18px;padding:16px 18px;backdrop-filter:blur(8px);box-shadow:0 12px 30px #0009}.msg-card b{display:block;font-size:20px;margin-bottom:7px}.msg-card small{color:#c9d5db;line-height:1.55}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:15px;padding:12px 10px;font-size:14px;font-weight:900;color:#111;background:linear-gradient(#ffe395,#ffc84e);box-shadow:0 6px 16px #0005,inset 0 1px #fff9;touch-action:manipulation}button.secondary{background:linear-gradient(#cfdae1,#9fb1bc)}
.hint{text-align:center;font-size:11.5px;line-height:1.42;color:#c9d7de;min-height:32px;background:#0b141bcc;border:1px dashed #ffffff24;border-radius:12px;padding:7px 10px}.funline{text-align:center;font-weight:900;font-size:12px;color:#ffe395;min-height:18px;text-shadow:0 1px 0 #000}.touch-pad{display:grid;grid-template-columns:repeat(3,51px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center;opacity:.78;user-select:none}.touch-pad button{padding:0;border-radius:12px;background:#26333c;color:#fff;box-shadow:none;border:1px solid #ffffff18;font-size:19px}.touch-pad .up{grid-column:2}.touch-pad .left{grid-column:1}.touch-pad .down{grid-column:2}.touch-pad .right{grid-column:3}
.toast{position:fixed;left:50%;top:11%;transform:translate(-50%,-10px);padding:9px 15px;border-radius:999px;font-weight:900;background:#071019e9;border:1px solid #ffffff33;opacity:0;pointer-events:none;transition:.18s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:700px){.board{height:62dvh;min-height:360px}.app{gap:5px}.hint{padding:5px 8px;min-height:26px}.touch-pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,36px)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">🌱 花盆出任務！</div><div class="subtitle">皮克敏尋寶大作戰・手機歪一點，花盆滾遠一點</div></div><div class="stats"><div class="pill">🗺️ <b>第<span id="level">1</span>關</b></div><div class="pill">💰 <span id="score">0</span>分</div><div class="pill">🔥 <span id="combo">x1</span></div><div class="pill">⏰ <span id="time">60</span>s</div><div class="pill">📡 <span id="sensorState">未啟用</span></div></div></div>
  <div class="board-wrap"><div class="board" id="board"><canvas id="game"></canvas><div class="center-msg" id="overlay"><div class="msg-card"><b>📱 手機一歪，花盆就開滾</b><small>🎁 寶箱：錢錢自己送上門。<br>🌱 皮克敏：可愛歸可愛，撞到一樣會扣分。<br>🕳️ 黑洞：免費送你回出生點。<br>🧲 磁鐵：它不是愛你，只是想吸你過去。<br>🟪 斜坡：免費加速，但方向不保證。</small></div></div></div></div>
  <div class="controls"><button id="sensorBtn">📱 叫醒手機陀螺儀</button><button class="secondary" id="restartBtn">↻ 我不服，再來一次</button></div>
  <div class="hint" id="hint">先把手機拿穩，再按「叫醒手機陀螺儀」。校正時別手抖，不然花盆會以為地球歪了。</div><div class="funline" id="funline">今日任務：用花盆尋寶，順便別撞飛皮克敏。</div>
  <div class="touch-pad" id="touchPad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('game'),board=document.getElementById('board'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),levelEl=document.getElementById('level'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay'),sensorBtn=document.getElementById('sensorBtn'),restartBtn=document.getElementById('restartBtn'),hint=document.getElementById('hint'),toast=document.getElementById('toast'),sensorState=document.getElementById('sensorState'),funline=document.getElementById('funline');
let W=0,H=0,dpr=1,last=performance.now(),running=false,score=0,timeLeft=60,lastSecond=performance.now(),level=1,combo=1,lastChestAt=0,chestsTaken=0;
let tilt={x:0,y:0},base={beta:0,gamma:0},sensorActive=false,sensorSeen=false,keyTilt={x:0,y:0},screenAngle=0,lastWallSound=0,lastBoundarySound=0,lastRampSound=0,lastMagnetSound=0;
let ball={x:0,y:0,vx:0,vy:0,r:14},chests=[],bombs=[],walls=[],holes=[],magnets=[],ramps=[],particles=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const FUN={
  chest:['✨ 特殊精華：今天的運氣正在發光。','不是撿寶，是採集高濃度快樂。','連吃精華中，請勿打擾吸收能量。','花盆表示：這波營養很補。'],
  bomb:['皮克敏：我這麼可愛你也撞？','撞到皮克敏，分數先去角落反省。','花盆表示：剛才那不是煞車，是社交。','小心！這些皮克敏今天脾氣不太好。'],
  hole:['地下室一日遊，已自動辦理退房。','黑洞說：歡迎再次光臨。','這不是失誤，是深入探索地形。','花盆短暫離線，人生重新連線。']
};
function randomFun(kind){const a=FUN[kind]||['鋼珠持續努力中。'];return a[Math.floor(Math.random()*a.length)]}
function setFunLine(t){funline.textContent=t}

let audioCtx=null,masterGain=null,compressor=null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(!masterGain){
      masterGain=audioCtx.createGain(); masterGain.gain.value=.78;
      compressor=audioCtx.createDynamicsCompressor();
      compressor.threshold.value=-18; compressor.knee.value=16; compressor.ratio.value=4;
      compressor.attack.value=.003; compressor.release.value=.18;
      masterGain.connect(compressor).connect(audioCtx.destination);
    }
  }catch(e){}
}
function rand(a,b){return a+Math.random()*(b-a)}
function env(g,t,peak,attack,hold,release){
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+attack);
  g.gain.setValueAtTime(Math.max(.0002,peak),t+attack+hold);
  g.gain.exponentialRampToValueAtTime(.0001,t+attack+hold+release);
}
function osc(freq,dur,type='sine',vol=.08,slideTo=null,when=0,dest=null){
  initAudio(); if(!audioCtx||!masterGain)return;
  const t=audioCtx.currentTime+when,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(25,slideTo),t+dur);
  env(g,t,vol,.004,Math.max(0,dur*.08),Math.max(.02,dur*.86));
  o.connect(g).connect(dest||masterGain); o.start(t); o.stop(t+dur+.04);
}
function noiseBurst(dur=.12,vol=.08,low=80,high=9000,when=0){
  initAudio(); if(!audioCtx||!masterGain)return;
  const t=audioCtx.currentTime+when,len=Math.max(1,Math.floor(audioCtx.sampleRate*dur));
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource(),hp=audioCtx.createBiquadFilter(),lp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
  hp.type='highpass'; hp.frequency.value=low; lp.type='lowpass'; lp.frequency.value=high;
  env(g,t,vol,.002,0,Math.max(.02,dur*.96)); src.buffer=buf;
  src.connect(hp).connect(lp).connect(g).connect(masterGain); src.start(t); src.stop(t+dur+.03);
}
function metallicHit(strength=.7,when=0){
  const base=rand(150,205),v=.045*strength;
  noiseBurst(.045,.07*strength,650,6500,when);
  osc(base,.12,'triangle',v,base*.62,when);
  osc(base*2.73,.055,'sine',v*.42,base*2.2,when+.004);
  osc(base*4.18,.035,'sine',v*.25,base*3.4,when+.006);
}
function coinClink(when=0,pitch=1){
  noiseBurst(.026,.035,1800,11000,when);
  osc(1850*pitch,.13,'sine',.055,1380*pitch,when);
  osc(2780*pitch,.08,'sine',.03,2250*pitch,when+.008);
}
function playSound(kind){
  initAudio(); if(!audioCtx)return;
  if(kind==='chest'){
    // 特殊精華：晶亮能量吸收聲
    osc(620,.10,'sine',.045,920,0);
    osc(980,.13,'triangle',.032,1450,.035);
    osc(1480,.18,'sine',.026,2100,.07);
    noiseBurst(.045,.012,1800,10000,.04);
  }else if(kind==='bomb'){
    // 可愛生物碰撞反應：原創高音短叫聲 + 彈跳感
    const base=rand(520,650);
    osc(base,.09,'triangle',.055,base*1.55,0);
    osc(base*1.9,.07,'sine',.025,base*1.2,.025);
    osc(base*.82,.11,'sine',.022,base*.62,.065);
    noiseBurst(.025,.012,1800,8500,.012);
    // 輕微碰撞，不再使用爆炸低頻
    metallicHit(.18,.02);
  }else if(kind==='__oldbomb__'){
    // legacy branch intentionally disabled
  }else if(kind==='hole'){
    // 掉落、空腔與遠去的低頻
    noiseBurst(.10,.035,120,2200,0);
    osc(330,.44,'sine',.075,72,0);
    osc(155,.54,'triangle',.055,38,.045);
  }else if(kind==='wall'){
    // 鋼珠撞木／牆面的實體敲擊
    metallicHit(rand(.65,.95),0);
    osc(rand(85,115),.07,'sine',.025,65,0);
  }else if(kind==='ramp'){
    // 鋼珠快速滾過斜坡的摩擦與加速
    noiseBurst(.10,.026,550,4200,0);
    osc(240,.12,'triangle',.025,420,0);
  }else if(kind==='magnet'){
    // 低頻磁力嗡鳴，帶一點金屬共振
    osc(84,.17,'sine',.045,72,0);
    osc(168,.13,'triangle',.018,145,.015);
    noiseBurst(.055,.012,900,3600,.01);
  }else if(kind==='level'){
    // 比電子嗶聲更像實體遊戲機的獎勵鈴聲
    coinClink(0,.82); coinClink(.09,.98); coinClink(.18,1.18);
    osc(392,.23,'triangle',.035,523,.10); osc(523,.28,'sine',.038,784,.20);
  }
}
function resize(){const r=board.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width-20;H=r.height-20;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!ball.x){ball.x=W/2;ball.y=H/2}}
new ResizeObserver(resize).observe(board);resize();
function toastMsg(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),760)}
function randomSpot(radius=24,extra=0){for(let t=0;t<400;t++){let p={x:35+Math.random()*(W-70),y:35+Math.random()*(H-70)};if(Math.hypot(p.x-ball.x,p.y-ball.y)<85)continue;let all=[...chests,...bombs,...holes,...magnets];if(all.some(o=>Math.hypot(p.x-o.x,p.y-o.y)<radius+(o.r||24)+18+extra))continue;if(walls.some(r=>p.x>r.x-35&&p.x<r.x+r.w+35&&p.y>r.y-35&&p.y<r.y+r.h+35))continue;return p}return{x:55,y:55}}
function baseWalls(){return[{x:W*.13,y:H*.27,w:W*.26,h:12},{x:W*.58,y:H*.15,w:12,h:H*.25},{x:W*.56,y:H*.63,w:W*.27,h:12},{x:W*.24,y:H*.73,w:12,h:H*.17}]}
function setupLevel(n,resetScore=false){level=n;if(resetScore){score=0}scoreEl.textContent=score;levelEl.textContent=level;combo=1;comboEl.textContent='x1';lastChestAt=0;chestsTaken=0;timeLeft=60;timeEl.textContent=timeLeft;ball={x:W/2,y:H/2,vx:0,vy:0,r:14};chests=[];bombs=[];walls=baseWalls();holes=[];magnets=[];ramps=[];particles=[];
  const chestCount=Math.min(4+n,7),bombCount=Math.min(2+n,6),holeCount=n>=2?Math.min(n-1,3):0,magnetCount=n>=2?1:0,rampCount=n>=3?Math.min(n-2,2):0;
  for(let i=0;i<chestCount;i++){let p=randomSpot();chests.push({...p,r:19,alive:true,pulse:Math.random()*6})}
  for(let i=0;i<bombCount;i++){let p=randomSpot();bombs.push({...p,r:18,alive:true,pulse:Math.random()*6,typeIndex:i%8,vx:n>=3?(Math.random()>.5?1:-1)*(18+n*7):0,vy:n>=3?(Math.random()>.5?1:-1)*(15+n*6):0})}
  for(let i=0;i<holeCount;i++){let p=randomSpot(22,10);holes.push({...p,r:20})}
  for(let i=0;i<magnetCount;i++){let p=randomSpot(25,10);magnets.push({...p,r:24,strength:120+n*20})}
  for(let i=0;i<rampCount;i++){ramps.push({x:W*(.14+i*.48),y:H*(.48-i*.18),w:W*.22,h:H*.12,fx:i%2?140:-140,fy:i%2?-40:60})}
  last=performance.now();lastSecond=performance.now();running=true;overlay.style.display='none';toastMsg('🚪 第 '+level+' 關開門！花盆正式出勤');setFunLine('第 '+level+' 關：先找寶箱，再閃過各路皮克敏。');
}
function restart(){setupLevel(1,true)}
function getScreenAngle(){const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);return ((a%360)+360)%360}
function applyOrientation(beta,gamma){
  if(beta==null||gamma==null)return;
  sensorSeen=true;screenAngle=getScreenAngle();
  if(!sensorActive){base.beta=beta;base.gamma=gamma;sensorActive=true;sensorState.textContent='已啟用';sensorState.style.color='#78e38b';}
  let gx=gamma-base.gamma, gy=beta-base.beta;
  // 依螢幕旋轉方向修正 X/Y 軸，橫拿手機也能正常控制
  let x=gx,y=gy;
  if(screenAngle===90){x=gy;y=-gx}else if(screenAngle===270){x=-gy;y=gx}else if(screenAngle===180){x=-gx;y=-gy}
  tilt.x=clamp(x/18,-1.35,1.35);
  tilt.y=clamp(y/18,-1.35,1.35);
}
function onOrientation(e){applyOrientation(e.beta,e.gamma)}
async function enableSensor(){
  initAudio();
  try{
    if(typeof DeviceOrientationEvent==='undefined')throw new Error('not supported');
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted')throw new Error('permission denied');
    }
    sensorActive=false;sensorSeen=false;tilt.x=tilt.y=0;
    window.removeEventListener('deviceorientation',onOrientation,true);
    window.removeEventListener('deviceorientationabsolute',onOrientation,true);
    window.addEventListener('deviceorientation',onOrientation,true);
    window.addEventListener('deviceorientationabsolute',onOrientation,true);
    sensorBtn.textContent='✓ 陀螺儀醒了，別再戳它';sensorState.textContent='等待資料';sensorState.style.color='#ffd166';
    hint.textContent='陀螺儀已起床。先穩住手機 1 秒，再慢慢傾斜；太激情，花盆會直接離家出走。';
    restart();
    setTimeout(()=>{
      if(!sensorSeen){sensorState.textContent='無資料';sensorState.style.color='#ff7b8c';hint.textContent='手機裝死，沒有回傳傾斜資料。請用 HTTPS（例如 GitHub Pages）並允許「動作與方向」權限；不然只能用方向鍵硬撐。'}
      else{hint.textContent='感測器正常上工！左右／前後傾斜即可控制；若方向很有自己的想法，再按一次按鈕重新校正。'}
    },1600);
  }catch(e){
    sensorState.textContent='不可用';sensorState.style.color='#ff7b8c';
    hint.textContent='抓不到手機方向感測器。請改用 HTTPS 網址及 Safari/Chrome；目前先用方向鍵，別讓花盆知道我們沒陀螺儀。';restart();
  }
}
sensorBtn.addEventListener('click',enableSensor);restartBtn.addEventListener('click',()=>{initAudio();restart()});document.addEventListener('pointerdown',initAudio,{once:true});
document.querySelectorAll('#touchPad button').forEach(b=>{const d=b.dataset.dir,down=e=>{e.preventDefault();initAudio();if(!running)restart();if(d==='left')keyTilt.x=-1;if(d==='right')keyTilt.x=1;if(d==='up')keyTilt.y=-1;if(d==='down')keyTilt.y=1},up=e=>{e.preventDefault();if(d==='left'||d==='right')keyTilt.x=0;if(d==='up'||d==='down')keyTilt.y=0};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
function circleRectCollide(c,r){let nx=clamp(c.x,r.x,r.x+r.w),ny=clamp(c.y,r.y,r.y+r.h),dx=c.x-nx,dy=c.y-ny;return dx*dx+dy*dy<c.r*c.r?{dx,dy}:null}
function burst(x,y,kind){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.6,size:2+Math.random()*4,kind})}
function resetBall(penalty=0){score+=penalty;scoreEl.textContent=score;combo=1;comboEl.textContent='x1';ball.x=W/2;ball.y=H/2;ball.vx=0;ball.vy=0}
function physics(dt,now){if(!running)return;let ax=(Math.abs(keyTilt.x)>.01?keyTilt.x:tilt.x)*460,ay=(Math.abs(keyTilt.y)>.01?keyTilt.y:tilt.y)*460;
  magnets.forEach(m=>{let dx=m.x-ball.x,dy=m.y-ball.y,d=Math.max(35,Math.hypot(dx,dy));if(d<150){let f=m.strength*(1-d/150);ax+=dx/d*f;ay+=dy/d*f;if(d<ball.r+m.r+8&&performance.now()-lastMagnetSound>350){playSound('magnet');lastMagnetSound=performance.now()}}});
  ramps.forEach(r=>{if(ball.x>r.x&&ball.x<r.x+r.w&&ball.y>r.y&&ball.y<r.y+r.h){ax+=r.fx;ay+=r.fy;if(performance.now()-lastRampSound>650){playSound('ramp');lastRampSound=performance.now()}}});
  ball.vx+=ax*dt;ball.vy+=ay*dt;const drag=Math.pow(.985,dt*60);ball.vx*=drag;ball.vy*=drag;let sp=Math.hypot(ball.vx,ball.vy),max=520+level*20;if(sp>max){ball.vx*=max/sp;ball.vy*=max/sp}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;

  walls.forEach(r=>{if(!circleRectCollide(ball,r))return;let cx=r.x+r.w/2,cy=r.y+r.h/2,dx=ball.x-cx,dy=ball.y-cy;if(Math.abs(dx/(r.w||1))>Math.abs(dy/(r.h||1))){ball.x=dx<0?r.x-ball.r:r.x+r.w+ball.r;ball.vx*=-.64}else{ball.y=dy<0?r.y-ball.r:r.y+r.h+ball.r;ball.vy*=-.64}if(performance.now()-lastWallSound>110){playSound('wall');lastWallSound=performance.now();if(Math.random()<.14)setFunLine('🧱 障礙物：路這麼大，你偏偏選我。')}});

function drawMetalBall(){

  ctx.restore();
}
function drawChest(o,t){
  if(!o.alive)return;
  ctx.save();ctx.translate(o.x,o.y);
  const pulse=(Math.sin(t*5+o.pulse)+1)/2;

    ctx.fillStyle=k===1?'#fff6b0':k===2?'#7fffe6':'#8c7cff';
    ctx.beginPath();ctx.arc(0,0,17+k*5+pulse*3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  let g=ctx.createRadialGradient(-6,-7,2,0,0,18);
  g.addColorStop(0,'#ffffff');g.addColorStop(.16,'#fff7a3');g.addColorStop(.42,'#7fffe8');g.addColorStop(.72,'#7b79ff');g.addColorStop(1,'#40286f');

  ctx.strokeStyle='#ffffffcc';ctx.lineWidth=1.4;ctx.stroke();
  // 內部旋轉能量
  ctx.rotate(t*1.7+o.pulse);
  ctx.strokeStyle='#ffffffcc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,9,.2,2.6);ctx.stroke();
  ctx.strokeStyle='#8dfff0cc';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,12,3.1,5.45);ctx.stroke();
  // 星芒
  ctx.rotate(-(t*1.7+o.pulse));ctx.shadowBlur=0;

const PIKMIN_TYPES=[

  {body:'#4c80df',shade:'#2953a9',accent:'#84adff',kind:'藍色',shape:'mouth',stem:'#4f9b45'},

function drawBomb(o,t){

}
function draw(t){ctx.clearRect(0,0,W,H);let grad=ctx.createRadialGradient(W*(.5-tilt.x*.12),H*(.5-tilt.y*.12),10,W/2,H/2,W*.7);grad.addColorStop(0,'#ffffff12');grad.addColorStop(1,'#0000002b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
